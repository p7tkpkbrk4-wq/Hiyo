  <text x="35" y="30" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#333333" font-weight="600">9:41</text>
  <rect x="320" y="20" width="3" height="4" rx="1" fill="#888888"/>
  <rect x="325" y="18" width="3" height="6" rx="1" fill="#666666"/>
  <rect x="330" y="16" width="3" height="8" rx="1" fill="#555555"/>
