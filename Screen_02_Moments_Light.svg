    <text x="20" y="96" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#666666">周末和朋友一起去了海边，阳光正好，海风</text>
    <text x="20" y="114" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#666666">温柔，一切都刚刚好～</text>
