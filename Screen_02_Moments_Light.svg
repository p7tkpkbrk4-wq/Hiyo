  <circle cx="285" cy="838" r="24" fill="transparent"/>
  <rect x="271" y="828" width="28" height="20" rx="6" stroke="#AAAAAA" stroke-width="1.8" fill="none"/>
  <path d="M273 828 L285 840 L297 828" stroke="#AAAAAA" stroke-width="1.8" fill="none" stroke-linecap="round"/>
