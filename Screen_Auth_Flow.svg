<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6FF"/>
      <stop offset="100%" stop-color="#F0EDFF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B9E"/>
      <stop offset="100%" stop-color="#9B7FFF"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8FF"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#9B7FFF" flood-opacity="0.15"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9B7FFF" opacity="0.6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="700" fill="url(#bgGrad)"/>
  <circle cx="800" cy="100" r="200" fill="#FFE0EE" opacity="0.3"/>
  <circle cx="100" cy="600" r="200" fill="#E8E0FF" opacity="0.3"/>

  <!-- Title -->
  <text x="450" y="55" font-family="SF Pro Display, -apple-system, sans-serif" font-size="26" fill="#333333" font-weight="800" text-anchor="middle">Hiyo 认证流程 Auth Flow</text>
  <rect x="350" y="68" width="200" height="3" rx="1.5" fill="url(#accentGrad)"/>
  <text x="450" y="92" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#999999" text-anchor="middle">Welcome → Login → Register → Complete Profile</text>

  <!-- Flow arrows -->
  <!-- Arrow: Welcome → Login/Guest -->
  <line x1="225" y1="260" x2="285" y2="260" stroke="#9B7FFF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
  <text x="255" y="250" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#9B7FFF" text-anchor="middle">登录</text>
  <text x="255" y="278" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#9B7FFF" text-anchor="middle">游客</text>

  <!-- Arrow: Login → Register -->
  <line x1="405" y1="260" x2="465" y2="260" stroke="#9B7FFF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
  <text x="435" y="250" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#9B7FFF" text-anchor="middle">注册</text>

  <!-- Arrow: Register → Complete Profile -->
  <line x1="585" y1="260" x2="645" y2="260" stroke="#9B7FFF" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
  <text x="615" y="250" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#9B7FFF" text-anchor="middle">完善</text>

  <!-- Arrow: Complete → Main App -->
  <line x1="765" y1="260" x2="825" y2="260" stroke="#FF6B9E" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
  <text x="795" y="250" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#FF6B9E" text-anchor="middle">完成</text>

  <!-- Screen 1: Welcome -->
  <g transform="translate(20, 120)">
    <!-- Phone frame -->
    <rect width="195" height="400" rx="24" fill="#FFFFFF" stroke="#EEEEFF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <!-- Status bar -->
    <rect x="0" y="0" width="195" height="24" fill="#F8F6FF" rx="24"/>
    <text x="20" y="16" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#333333">9:41</text>
    <!-- Content -->
    <circle cx="97" cy="90" r="40" fill="url(#accentGrad)" opacity="0.15"/>
    <text x="97" y="100" font-family="SF Pro Display, -apple-system, sans-serif" font-size="28" fill="#FF6B9E" font-weight="800" text-anchor="middle">Hi</text>
    <text x="97" y="148" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" fill="#333333" font-weight="800" text-anchor="middle">Hiyo</text>
    <text x="97" y="168" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#999999" text-anchor="middle">与陌生人交朋友</text>
    <!-- Cards -->
    <rect x="20" y="185" width="72" height="50" rx="10" fill="#FFE0EE" stroke="#FF6B9E" stroke-width="2"/>
    <text x="56" y="216" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#333333" text-anchor="middle">游客</text>
    <rect x="100" y="185" width="72" height="50" rx="10" fill="#F5F5F5" stroke="#EEEEFF" stroke-width="1"/>
    <text x="136" y="216" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">登录</text>
    <!-- Button -->
    <rect x="20" y="250" width="155" height="28" rx="14" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="97" y="268" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">开始</text>
    <!-- Tab bar -->
    <rect x="0" y="380" width="195" height="20" fill="#FFFFFF" rx="0"/>
    <circle cx="30" cy="390" r="8" fill="#FF6B9E"/>
    <circle cx="75" cy="390" r="8" fill="#EEEEEE"/>
    <circle cx="120" cy="390" r="8" fill="#EEEEEE"/>
    <circle cx="165" cy="390" r="8" fill="#EEEEEE"/>
    <text x="97" y="350" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#9B7FFF" font-weight="600" text-anchor="middle">① 欢迎页</text>
  </g>

  <!-- Screen 2: Login -->
  <g transform="translate(240, 120)">
    <rect width="195" height="400" rx="24" fill="#FFFFFF" stroke="#EEEEFF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="195" height="24" fill="#F8F6FF" rx="24"/>
    <text x="20" y="16" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#333333">9:41</text>
    <!-- Back -->
    <circle cx="20" cy="40" r="12" fill="#F5F0FF"/>
    <path d="M16 40 L20 36 L24 40 M20 36 L20 44" stroke="#333333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Content -->
    <text x="20" y="90" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#333333" font-weight="800">欢迎回来！</text>
    <text x="20" y="110" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#999999">登录你的账号</text>
    <!-- Form -->
    <rect x="15" y="125" width="165" height="28" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="25" y="143" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC">用户名</text>
    <rect x="15" y="160" width="165" height="28" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="25" y="178" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC">密码</text>
    <!-- Button -->
    <rect x="15" y="200" width="165" height="28" rx="8" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="97" y="218" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#FFFFFF" font-weight="600" text-anchor="middle">登录</text>
    <!-- Link -->
    <text x="97" y="248" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#999999" text-anchor="middle">没有账号？</text>
    <text x="97" y="262" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#FF6B9E" text-anchor="middle">立即注册</text>
    <!-- Tab bar -->
    <rect x="0" y="380" width="195" height="20" fill="#FFFFFF"/>
    <circle cx="30" cy="390" r="8" fill="#EEEEEE"/>
    <circle cx="75" cy="390" r="8" fill="#EEEEEE"/>
    <circle cx="120" cy="390" r="8" fill="#EEEEEE"/>
    <circle cx="165" cy="390" r="8" fill="#FF6B9E"/>
    <text x="97" y="350" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#9B7FFF" font-weight="600" text-anchor="middle">② 登录页</text>
  </g>

  <!-- Screen 3: Register -->
  <g transform="translate(460, 120)">
    <rect width="195" height="400" rx="24" fill="#FFFFFF" stroke="#EEEEFF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="195" height="24" fill="#F8F6FF" rx="24"/>
    <text x="20" y="16" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#333333">9:41</text>
    <!-- Back -->
    <circle cx="20" cy="40" r="12" fill="#F5F0FF"/>
    <path d="M16 40 L20 36 L24 40 M20 36 L20 44" stroke="#333333" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <!-- Title -->
    <text x="20" y="85" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#333333" font-weight="800">注册新账号</text>
    <!-- Avatar -->
    <circle cx="97" cy="115" r="22" fill="#FFFFFF" stroke="#FF6B9E" stroke-width="2"/>
    <circle cx="97" cy="110" r="10" fill="#F5F0FF"/>
    <ellipse cx="97" cy="125" rx="14" ry="14" fill="#F5F0FF"/>
    <text x="97" y="160" font-family="SF Pro Display, -apple-system, sans-serif" font-size="8" fill="#AAAAAA" text-anchor="middle">上传头像</text>
    <!-- Fields -->
    <rect x="15" y="168" width="165" height="26" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="25" y="184" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC">邮箱</text>
    <rect x="15" y="200" width="100" height="26" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="25" y="216" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC">验证码</text>
    <rect x="120" y="200" width="60" height="26" rx="8" fill="#9B7FFF"/>
    <text x="150" y="216" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle">发送</text>
    <rect x="15" y="232" width="165" height="26" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="25" y="248" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC">用户名</text>
    <rect x="15" y="264" width="165" height="26" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="25" y="280" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC">密码</text>
    <!-- Button -->
    <rect x="15" y="302" width="165" height="30" rx="15" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="97" y="321" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">注册</text>
    <text x="97" y="350" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#9B7FFF" font-weight="600" text-anchor="middle">③ 注册页</text>
  </g>

  <!-- Screen 4: Complete Profile -->
  <g transform="translate(680, 120)">
    <rect width="195" height="400" rx="24" fill="#FFFFFF" stroke="#EEEEFF" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="195" height="24" fill="#F8F6FF" rx="24"/>
    <text x="20" y="16" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#333333">9:41</text>
    <!-- Title -->
    <text x="15" y="55" font-family="SF Pro Display, -apple-system, sans-serif" font-size="16" fill="#333333" font-weight="800">完善资料</text>
    <!-- Avatar -->
    <circle cx="97" cy="88" r="22" fill="#FFFFFF" stroke="#FF6B9E" stroke-width="2"/>
    <circle cx="97" cy="83" r="10" fill="#F5F0FF"/>
    <ellipse cx="97" cy="98" rx="14" ry="14" fill="#F5F0FF"/>
    <!-- Gender -->
    <rect x="15" y="120" width="72" height="24" rx="8" fill="#FFE0EE" stroke="#FF6B9E" stroke-width="1.5"/>
    <text x="51" y="136" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#FF6B9E" text-anchor="middle">♀ 女</text>
    <rect x="92" y="120" width="72" height="24" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="128" y="136" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">男</text>
    <!-- Birthday -->
    <rect x="15" y="152" width="165" height="24" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="25" y="168" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC">选择生日</text>
    <!-- Country -->
    <rect x="15" y="182" width="165" height="24" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="25" y="198" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC">选择国家/城市</text>
    <!-- Height/Weight -->
    <rect x="15" y="212" width="78" height="24" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="54" y="228" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC" text-anchor="middle">170cm</text>
    <rect x="98" y="212" width="82" height="24" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="139" y="228" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC" text-anchor="middle">60kg</text>
    <!-- Bio -->
    <rect x="15" y="242" width="165" height="36" rx="8" fill="#FAFAFA" stroke="#EEEEFF"/>
    <text x="25" y="260" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#CCCCCC">介绍一下自己...</text>
    <!-- Tags -->
    <rect x="15" y="285" width="46" height="20" rx="10" fill="#FFE0EE" stroke="#FF6B9E"/>
    <text x="38" y="298" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#FF6B9E" text-anchor="middle">旅行</text>
    <rect x="66" y="285" width="46" height="20" rx="10" fill="#E8E0FF" stroke="#9B7FFF"/>
    <text x="89" y="298" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#9B7FFF" text-anchor="middle">摄影</text>
    <rect x="117" y="285" width="46" height="20" rx="10" fill="#FFE0EE" stroke="#FF6B9E"/>
    <text x="140" y="298" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#FF6B9E" text-anchor="middle">音乐</text>
    <rect x="15" y="310" width="46" height="20" rx="10" fill="#F5F5F5"/>
    <text x="38" y="323" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#AAAAAA" text-anchor="middle">健身</text>
    <rect x="66" y="310" width="46" height="20" rx="10" fill="#F5F5F5"/>
    <text x="89" y="323" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#AAAAAA" text-anchor="middle">美食</text>
    <!-- Button -->
    <rect x="15" y="345" width="165" height="30" rx="15" fill="url(#accentGrad)" filter="url(#glow)"/>
    <text x="97" y="364" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#FFFFFF" font-weight="600" text-anchor="middle">完成</text>
    <text x="97" y="395" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#9B7FFF" font-weight="600" text-anchor="middle">④ 完善资料</text>
  </g>

  <!-- Main App -->
  <g transform="translate(680, 430)">
    <rect width="195" height="160" rx="24" fill="url(#accentGrad)" opacity="0.1" stroke="#9B7FFF" stroke-width="2" filter="url(#cardShadow)"/>
    <text x="97" y="70" font-family="SF Pro Display, -apple-system, sans-serif" font-size="20" fill="#9B7FFF" font-weight="800" text-anchor="middle">Hiyo App</text>
    <text x="97" y="95" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#9B7FFF" text-anchor="middle">主界面</text>
    <!-- Tab icons -->
    <circle cx="40" cy="125" r="12" fill="#FF6B9E"/>
    <circle cx="77" cy="125" r="12" fill="#EEEEEE"/>
    <circle cx="117" cy="125" r="12" fill="#EEEEEE"/>
    <circle cx="155" cy="125" r="12" fill="#EEEEEE"/>
  </g>

  <!-- Flow labels -->
  <text x="450" y="560" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#666666" text-anchor="middle">用户认证流程图 Auth Flowchart</text>
  <text x="450" y="585" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#999999" text-anchor="middle">Purple/Pink 渐变色主题 · Light Theme · 亮色风格</text>
  <text x="450" y="605" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#BBBBBB" text-anchor="middle">4 Screens · Masonry Layout · Objective-C</text>
</svg>
