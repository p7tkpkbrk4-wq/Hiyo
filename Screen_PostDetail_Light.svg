          <path d="M10 14 C7 10 4 8 4 6.5 C4 5 5.5 4 7 4 C8 4 9 4.5 9.5 5.5 C10 4.5 11 4 12 4 C13.5 4 15 5 15 6.5 C15 8 12 10 10 14 Z" fill="#FF6B9E" transform="scale(0.8) translate(2.5, 2.5)"/>
          <text x="26" y="14" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#999999">128</text>
