        <text x="50" y="32" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#555555">好期待！需要带什么装备吗？</text>
        <text x="50" y="50" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#999999">1分钟前</text>
        <text x="382" y="50" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#FF6B9E" text-anchor="end">回复</text>
