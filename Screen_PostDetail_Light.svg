      <text x="24" y="100" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#333333" font-weight="700">周末一起去徒步吧</text>

      <!-- Content -->
      <text x="24" y="130" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#555555">这周天气不错，有没有小伙伴想一起去郊外徒步？路线已经规划好了，全程大概10公里，沿途风景很美～</text>

