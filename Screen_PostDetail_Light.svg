        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#FF6B9E"/>
      </g>

      <g transform="translate(100, 0)">
        <circle cx="16" cy="16" r="16" fill="#E8F5FF"/>
        <svg x="0" y="0" width="32" height="32" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" fill="#38BDF8"/></svg>
      </g>

      <g transform="translate(150, 0)">
        <circle cx="16" cy="16" r="16" fill="#FFF8E0"/>
        <svg x="0" y="0" width="32" height="32" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zM8 14h8M12 10v8" stroke="#FF9800" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
