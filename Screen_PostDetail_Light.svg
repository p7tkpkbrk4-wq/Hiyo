<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 926" width="430" height="926">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6FF"/>
      <stop offset="100%" stop-color="#F0EDFF"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9E"/>
      <stop offset="100%" stop-color="#9B7FFF"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8FF"/>
    </linearGradient>
    <linearGradient id="msgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAFAFA"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#9B7FFF" flood-opacity="0.12"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="avatarShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF6B9E" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="430" height="926" fill="url(#bgGrad)"/>
  <circle cx="380" cy="100" r="200" fill="#FFE0EE" opacity="0.2"/>
  <circle cx="50" cy="800" r="180" fill="#E8E0FF" opacity="0.3"/>

  <!-- Navigation Bar -->
  <rect width="430" height="100" fill="#FFFFFF" opacity="0.95"/>
  <line x1="0" y1="100" x2="430" y2="100" stroke="#EEEEFF" stroke-width="1"/>

  <!-- Back button -->
  <g transform="translate(8, 55)">
    <circle cx="22" cy="22" r="22" fill="#F5F0FF" opacity="0.8"/>
    <path d="M15 16 L10 22 L15 28 M10 22 L28 22" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Title -->
  <text x="215" y="77" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#333333" font-weight="700" text-anchor="middle">帖子详情</text>

  <!-- Like button -->
  <g transform="translate(358, 55)">
    <circle cx="22" cy="22" r="22" fill="#FFF0F5"/>
    <path d="M22 30 C16 24 10 20 10 16 C10 13 12 11 15 11 C17 11 19 12 20 14 C21 12 23 11 25 11 C28 11 30 13 30 16 C30 20 24 24 22 30 Z" fill="#FF6B9E"/>
  </g>

  <!-- Scrollable TableView content -->
  <g transform="translate(0, 100)">

    <!-- Post Header Card -->
    <g transform="translate(0, 0)">
      <rect width="430" height="320" fill="#FFFFFF" opacity="0.95"/>
      <line x1="0" y1="320" x2="430" y2="320" stroke="#F0F0F5" stroke-width="8"/>

      <!-- User info -->
      <g transform="translate(24, 20)">
        <circle cx="28" cy="28" r="28" fill="#FFE0EE" filter="url(#avatarShadow)"/>
        <circle cx="28" cy="24" r="12" fill="#F5F0FF"/>
        <ellipse cx="28" cy="36" rx="16" ry="16" fill="#F5F0FF"/>
        <circle cx="56" cy="56" r="8" fill="#4CAF50"/>
      </g>
      <text x="88" y="30" font-family="SF Pro Display, -apple-system, sans-serif" font-size="15" fill="#333333" font-weight="700">小明同学</text>
      <text x="88" y="50" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#999999">在线 · 2小时前</text>
      <text x="406" y="36" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#FF6B9E" text-anchor="end">+关注</text>

