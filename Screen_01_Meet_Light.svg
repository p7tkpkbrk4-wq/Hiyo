<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 926" width="430" height="926">
  <defs>
    <!-- Light Gradients -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8F6FF"/>
      <stop offset="100%" stop-color="#F0EDFF"/>
    </linearGradient>
    <linearGradient id="cardLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF8FF"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B9E"/>
      <stop offset="100%" stop-color="#FF4081"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B7FFF"/>
      <stop offset="100%" stop-color="#C44FE3"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B9E"/>
      <stop offset="100%" stop-color="#C44FE3"/>
    </linearGradient>
    <linearGradient id="cardOverlayL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00000000"/>
      <stop offset="100%" stop-color="#99000000"/>
    </linearGradient>
    <linearGradient id="tabGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B9E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C44FE3" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadowL">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#C44FE3" flood-opacity="0.15"/>
    </filter>
    <filter id="cardShadowL">
      <feDropShadow dx="0" dy="3" stdDeviation="10" flood-color="#8B5CF6" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Light Background -->
  <rect width="430" height="926" fill="url(#bgLight)"/>
  <!-- Subtle pattern overlay -->
  <circle cx="50" cy="200" r="150" fill="#E8E0FF" opacity="0.4"/>
  <circle cx="400" cy="600" r="200" fill="#FFE0EE" opacity="0.3"/>
  <circle cx="200" cy="800" r="120" fill="#E0E8FF" opacity="0.3"/>

  <!-- Status Bar -->
  <rect x="0" y="0" width="430" height="54" fill="transparent"/>
  <text x="35" y="30" font-family="SF Pro Display, -apple-system, sans-serif" font-size="11" fill="#333333" font-weight="600">9:41</text>
  <rect x="320" y="20" width="3" height="4" rx="1" fill="#888888"/>
  <rect x="325" y="18" width="3" height="6" rx="1" fill="#666666"/>
  <rect x="330" y="16" width="3" height="8" rx="1" fill="#555555"/>
  <rect x="335" y="14" width="3" height="10" rx="1" fill="#333333"/>
  <rect x="354" y="17" width="22" height="11" rx="2.5" fill="none" stroke="#333333" stroke-width="1.2" opacity="0.5"/>
  <rect x="356" y="19" width="18" height="7" rx="1" fill="#333333"/>

  <!-- Navigation Bar -->
  <rect x="0" y="54" width="430" height="56" fill="#FFFFFF" opacity="0.9"/>
  <rect x="0" y="109" width="430" height="1" fill="#EEEEFF"/>
  <text x="215" y="90" font-family="SF Pro Display, -apple-system, sans-serif" font-size="18" fill="#333333" font-weight="800" text-anchor="middle">遇见</text>
  <circle cx="380" cy="82" r="14" fill="url(#purpleGrad)" opacity="0.15"/>
  <circle cx="380" cy="82" r="8" fill="#9B7FFF"/>
  <path d="M376 82 L380 78 L384 82 M380 78 L380 86" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Swipe Card Stack -->
  <!-- Card 3 -->
  <g transform="translate(20, 130) rotate(-4)">
    <rect width="390" height="540" rx="24" fill="#E8E0FF" opacity="0.5"/>
  </g>
  <!-- Card 2 -->
  <g transform="translate(12, 125) rotate(-2)">
    <rect width="390" height="540" rx="24" fill="#F0E8FF" opacity="0.7"/>
  </g>
  <!-- Card 1 (main) -->
  <g transform="translate(8, 120)">
    <rect width="390" height="540" rx="24" fill="url(#cardLight)" filter="url(#shadowL)"/>
    <!-- Avatar area -->
    <rect x="0" y="0" width="390" height="380" rx="24" fill="#E8DCFF"/>
    <circle cx="195" cy="180" r="100" fill="#D4C8F5" opacity="0.6"/>
    <circle cx="195" cy="155" r="45" fill="#C0B0E8"/>
    <ellipse cx="195" cy="230" rx="65" ry="70" fill="#C0B0E8"/>
    <!-- Online indicator -->
    <circle cx="265" cy="155" r="12" fill="#FFFFFF"/>
    <circle cx="265" cy="155" r="9" fill="#4CAF50"/>
    <circle cx="261" cy="151" r="2.5" fill="#FFFFFF" opacity="0.6"/>
    <!-- Gradient overlay -->
    <rect x="0" y="220" width="390" height="320" fill="url(#cardOverlayL)"/>
    <!-- User Info -->
    <text x="24" y="400" font-family="SF Pro Display, -apple-system, sans-serif" font-size="26" fill="#FFFFFF" font-weight="800">Emily</text>
    <rect x="110" y="383" width="34" height="22" rx="6" fill="rgba(255,255,255,0.3)" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <text x="127" y="399" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">24</text>
    <text x="150" y="396" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="rgba(255,255,255,0.8)">♀  2.5km</text>
    <rect x="24" y="410" width="46" height="18" rx="9" fill="#FFD700" opacity="0.9"/>
    <text x="47" y="423" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#8B6914" font-weight="800" text-anchor="middle">⭐ VIP</text>
    <text x="24" y="448" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">Love traveling and photography ✈️</text>
    <text x="24" y="470" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="rgba(255,255,255,0.85)">Looking for someone genuine 💕</text>
    <rect x="24" y="484" width="56" height="22" rx="11" fill="rgba(255,107,158,0.25)"/>
    <text x="52" y="499" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#FF6B9E" text-anchor="middle" font-weight="600">旅行</text>
    <rect x="88" y="484" width="56" height="22" rx="11" fill="rgba(155,127,255,0.25)"/>
    <text x="116" y="499" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#9B7FFF" text-anchor="middle" font-weight="600">摄影</text>
    <rect x="152" y="484" width="56" height="22" rx="11" fill="rgba(255,107,158,0.25)"/>
    <text x="180" y="499" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#FF6B9E" text-anchor="middle" font-weight="600">音乐</text>
    <rect x="216" y="484" width="56" height="22" rx="11" fill="rgba(155,127,255,0.25)"/>
    <text x="244" y="499" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#9B7FFF" text-anchor="middle" font-weight="600">美食</text>
  </g>

  <!-- Action Buttons -->
  <circle cx="120" cy="700" r="34" fill="#FFFFFF" stroke="#FF6B6B" stroke-width="3" filter="url(#cardShadowL)"/>
  <path d="M110 690 L130 710 M130 690 L110 710" stroke="#FF6B6B" stroke-width="3.5" stroke-linecap="round"/>

  <circle cx="215" cy="700" r="30" fill="#FFFFFF" stroke="#9B7FFF" stroke-width="3" filter="url(#cardShadowL)"/>
  <path d="M215 680 L218 692 L231 692 L221 700 L225 712 L215 705 L205 712 L209 700 L199 692 L212 692 Z" fill="#9B7FFF"/>

  <circle cx="310" cy="700" r="34" fill="url(#pinkGrad)" filter="url(#glow)"/>
  <path d="M310 685 C300 678 288 686 288 696 C288 710 310 722 310 722 C310 722 332 710 332 696 C332 686 320 678 310 685" fill="#FFFFFF"/>

  <!-- Hint -->
  <text x="215" y="760" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA" text-anchor="middle">— 遇见 · 遇见心动 —</text>

  <!-- Tab Bar -->
  <rect x="0" y="800" width="430" height="90" fill="#FFFFFF" opacity="0.98"/>
  <rect x="0" y="800" width="430" height="1" fill="#EEEEFF"/>
  <!-- iOS tab bar top line -->
  <rect x="0" y="800" width="430" height="1.5" fill="rgba(155,127,255,0.3)"/>
  <!-- Tab 1: Meet (active) -->
  <circle cx="50" cy="838" r="24" fill="url(#pinkGrad)" filter="url(#glow)"/>
  <path d="M50 824 C40 818 28 825 28 835 C28 848 50 858 50 858 C50 858 72 848 72 835 C72 825 60 818 50 824" fill="#FFFFFF"/>
  <text x="50" y="876" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#FF6B9E" text-anchor="middle" font-weight="700">遇见</text>
  <!-- Tab 2: Moments -->
  <circle cx="145" cy="838" r="24" fill="transparent"/>
  <rect x="132" y="828" width="26" height="18" rx="3" stroke="#AAAAAA" stroke-width="1.5" fill="none"/>
  <circle cx="137" cy="833" r="1.5" fill="#AAAAAA"/>
  <circle cx="142" cy="833" r="1.5" fill="#AAAAAA"/>
  <circle cx="147" cy="833" r="1.5" fill="#AAAAAA"/>
  <text x="145" y="876" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">动态</text>
  <!-- Tab 3: Messages -->
  <circle cx="285" cy="838" r="24" fill="transparent"/>
  <rect x="271" y="828" width="28" height="20" rx="6" stroke="#AAAAAA" stroke-width="1.8" fill="none"/>
  <path d="M273 828 L285 840 L297 828" stroke="#AAAAAA" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <circle cx="302" cy="828" r="8" fill="#FF6B9E"/>
  <text x="302" y="832" font-family="SF Pro Display, -apple-system, sans-serif" font-size="9" fill="#FFFFFF" text-anchor="middle" font-weight="700">3</text>
  <text x="285" y="876" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">消息</text>
  <!-- Tab 4: My -->
  <circle cx="380" cy="838" r="24" fill="transparent"/>
  <circle cx="380" cy="831" r="7" fill="none" stroke="#AAAAAA" stroke-width="1.8"/>
  <path d="M370 845 C370 838 390 838 390 845" stroke="#AAAAAA" stroke-width="1.8" fill="none"/>
  <text x="380" y="876" font-family="SF Pro Display, -apple-system, sans-serif" font-size="10" fill="#AAAAAA" text-anchor="middle">我的</text>

  <text x="215" y="24" font-family="SF Pro Display, -apple-system, sans-serif" font-size="13" fill="#999999" font-weight="500" text-anchor="middle">遇见 MEET · Screen 1/4</text>
</svg>
