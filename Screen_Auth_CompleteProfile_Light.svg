        <text x="226" y="18" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA">美食</text>

        <rect x="0" y="38" width="56" height="28" rx="14" fill="#F5F5F5" filter="url(#tagShadow)"/>
        <text x="28" y="56" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA">健身</text>

        <rect x="66" y="38" width="56" height="28" rx="14" fill="#F5F5F5" filter="url(#tagShadow)"/>
        <text x="94" y="56" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA">电影</text>

        <rect x="132" y="38" width="56" height="28" rx="14" fill="#F5F5F5" filter="url(#tagShadow)"/>
        <text x="160" y="56" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA">游戏</text>

        <rect x="198" y="38" width="56" height="28" rx="14" fill="#F5F5F5" filter="url(#tagShadow)"/>
        <text x="226" y="56" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA">阅读</text>

        <rect x="0" y="76" width="56" height="28" rx="14" fill="#F5F5F5" filter="url(#tagShadow)"/>
        <text x="28" y="94" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA">美食</text>

        <rect x="66" y="76" width="56" height="28" rx="14" fill="#F5F5F5" filter="url(#tagShadow)"/>
        <text x="94" y="94" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA">健身</text>

        <rect x="132" y="76" width="56" height="28" rx="14" fill="#F5F5F5" filter="url(#tagShadow)"/>
        <text x="160" y="94" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA">电影</text>

        <rect x="198" y="76" width="56" height="28" rx="14" fill="#F5F5F5" filter="url(#tagShadow)"/>
        <text x="226" y="94" font-family="SF Pro Display, -apple-system, sans-serif" font-size="12" fill="#AAAAAA">游戏</text>
