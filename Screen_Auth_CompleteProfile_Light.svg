  <circle cx="380" cy="150" r="200" fill="#FFE0EE" opacity="0.3"/>
  <circle cx="30" cy="850" r="180" fill="#E8E0FF" opacity="0.4"/>

  <!-- Header -->
  <text x="32" y="80" font-family="SF Pro Display, -apple-system, sans-serif" font-size="28" fill="#333333" font-weight="800">完善个人资料</text>
  <text x="32" y="108" font-family="SF Pro Display, -apple-system, sans-serif" font-size="14" fill="#999999">完善资料可以获得更多关注</text>

  <!-- Avatar -->
